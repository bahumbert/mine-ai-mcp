template: ../../templates/flat-single-action.yaml
name: contract-held-shooter
tags:
  - contract
description: Measure the held skeleton attribute command and stored readback.
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: held-shooter
reset: []
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - difficulty easy
  - time set 18000
entities:
  - type: skeleton
    pos: [0.5, -60, 3.5]
    nbt: '{NoAI:1b,PersistenceRequired:1b}'
players:
  - name: Actor
    pos: [0.5, -60, 0.5]
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
