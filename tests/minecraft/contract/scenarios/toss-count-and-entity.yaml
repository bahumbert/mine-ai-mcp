template: ../../templates/flat-single-action.yaml
name: contract-toss-count-and-entity
tags:
  - contract
description: A toss lowers the count once toss returns, then item entities holding the tossed items appear (one per item
  for a part of a stack, merged later by the server). Contract check
  tests/minecraft/contract/checks/toss-count-and-entity.ts, also run on the fake bot (bot-contract.test.ts); setup from
  setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
params:
  check: toss-count-and-entity
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: cobblestone
        count: 10
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
