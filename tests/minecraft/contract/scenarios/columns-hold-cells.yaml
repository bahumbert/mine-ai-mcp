template: ../../templates/flat-single-action.yaml
name: contract-columns-hold-cells
tags:
  - contract
description: The feet's chunk and the square around it are listed by getColumns, and each column holds the cells blockAt
  reads. Contract check tests/minecraft/contract/checks/columns-hold-cells.ts, also run on the fake bot
  (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
params:
  check: columns-hold-cells
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock 2 -60 0 oak_stairs[facing=east,half=top]
  - setblock -3 -60 -4 gold_block
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
