template: ../../templates/flat-single-action.yaml
name: contract-damage-event-attacker
tags:
  - contract
description: "A damage_event names the attacker as cause entity id + 1 and the direct entity (an arrow) as direct id + 1, 0 when absent. Contract check tests/minecraft/contract/checks/damage-event-attacker.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: damage-event-attacker
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - difficulty easy
  - time set 18000
entities:
  - type: zombie
    pos:
      - 2.5
      - -60
      - 0.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
