template: ../../templates/flat-single-action.yaml
name: contract-click-window-shift-move
tags:
  - contract
description: A shift click moves a stack to the other part of the inventory; the server's result wins over the client's
  prediction. Contract check tests/minecraft/contract/checks/click-window-shift-move.ts, also run on the fake bot
  (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: click-window-shift-move
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: dirt
        count: 70
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
