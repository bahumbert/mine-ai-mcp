template: ../../templates/flat-single-action.yaml
name: contract-lava-over-passable
tags:
  - contract
description: What lava does over blocks it cannot pour into. A lava source in the cell above sugar cane (on dirt, water
  beside it), a nether portal block (inside its obsidian frame), a structure void and air (the control), each walled in
  stone so the lava can only move down; the cells are read after two lava steps (79 observed ticks). Contract check
  tests/minecraft/contract/checks/lava-over-passable.ts, waits for the fake's lava answer (T7e5b) before it runs on the
  fake bot; setup from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
params:
  check: lava-over-passable
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock -5 -60 -4 stone
  - setblock -3 -60 -4 stone
  - setblock -4 -60 -5 stone
  - setblock -4 -60 -3 stone
  - setblock -5 -59 -4 stone
