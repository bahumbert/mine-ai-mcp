template: ../../templates/flat-single-action.yaml
name: contract-click-window-variant-split
tags:
  - contract
description: The other clicks on a renamed stack (a right-click split and put-down, a merge onto its own variant, a shift click toward
  a plain partial stack) are predicted plain by Prismarine and answered renamed by the server, which corrects the cursor with
  set_cursor_item and each wrong slot with set_slot. Contract check tests/minecraft/contract/checks/click-window-variant-split.ts,
  also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: click-window-variant-split
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock 0 -60 0 chest
  - item replace block 0 -60 0 container.0 with cobblestone[custom_name='"first"'] 5
players:
  - name: Actor
    pos:
      - -4.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: cobblestone
        count: 10
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
