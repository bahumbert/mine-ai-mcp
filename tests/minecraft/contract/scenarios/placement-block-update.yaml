template: ../../templates/flat-single-action.yaml
name: contract-placement-block-update
tags:
  - contract
description: placeBlock ends on the cell's blockUpdate, and the server takes one block from the held stack. Contract
  check tests/minecraft/contract/checks/placement-block-update.ts, also run on the fake bot (bot-contract.test.ts);
  setup from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
params:
  check: placement-block-update
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: cobblestone
        count: 4
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
