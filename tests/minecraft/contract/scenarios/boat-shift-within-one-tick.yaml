template: ../../templates/flat-single-action.yaml
name: contract-boat-shift-within-one-tick
tags:
  - contract
description: A shift pressed and released with no server tick between leaves her seated on both sides and nothing is
  heard; held two ticks it lets her off. Contract check tests/minecraft/contract/checks/boat-shift-within-one-tick.ts,
  also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: boat-shift-within-one-tick
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
entities:
  - type: oak_boat
    pos:
      - 2.5
      - -60
      - 0.5
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
