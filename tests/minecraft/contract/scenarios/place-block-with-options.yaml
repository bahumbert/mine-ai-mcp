template: ../../templates/flat-single-action.yaml
name: contract-place-block-with-options
tags:
  - contract
description: A placement with options clicks the face of a block with a cursor inside it, and the server reads the
  cursor - a slab or a stair put on a side face takes the half the click was in; offhand places the block the off hand
  holds; forceLook 'ignore' leaves the look where it was; the server answers with the cell's block change and one
  acknowledgement. Contract check tests/minecraft/contract/checks/place-block-with-options.ts, also run on the fake bot
  (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: place-block-with-options
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock 2 -60 0 stone
  - setblock 2 -60 2 stone
  - setblock 2 -60 -2 stone
  - setblock 2 -60 4 stone
  - setblock 2 -60 -4 stone
  - setblock 2 -60 6 stone
  - setblock 1 -60 6 stone
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: oak_slab
        count: 4
      - item: oak_stairs
        count: 1
      - item: cobblestone
        count: 1
      - item: red_bed
        count: 1
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
