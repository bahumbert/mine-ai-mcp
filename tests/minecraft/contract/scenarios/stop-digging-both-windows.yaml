template: ../../templates/flat-single-action.yaml
name: contract-stop-digging-both-windows
tags:
  - contract
description: stopDigging during the dig's look does nothing (the dig ends); after the dig packet it aborts and the block
  stays. Contract check tests/minecraft/contract/checks/stop-digging-both-windows.ts, also run on the fake bot
  (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
params:
  check: stop-digging-both-windows
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock 1 -60 0 dirt
  - setblock -1 -60 0 dirt
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
