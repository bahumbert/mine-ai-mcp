template: ../../templates/flat-single-action.yaml
name: contract-world-age-per-second
tags:
  - contract
description: "The world age arrives in one time packet a second, 20 ticks each: the fake server's clock. Contract check
  tests/minecraft/contract/checks/world-age-per-second.ts, also run on the fake bot (bot-contract.test.ts); setup from
  setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
params:
  check: world-age-per-second
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
