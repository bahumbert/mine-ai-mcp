template: ../../templates/flat-single-action.yaml
name: contract-whisper-echo
tags:
  - contract
description: "Two whispers sent back to back, to the bot itself (a contract scenario has one player), are each answered with the outgoing line (You whisper to X: text) and then the received line (X whispers to you: text), in order, as chat-position messages whose translate is the English format string. Contract check tests/minecraft/contract/checks/whisper-echo.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: whisper-echo
reset: []
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
