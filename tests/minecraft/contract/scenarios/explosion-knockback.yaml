template: ../../templates/flat-single-action.yaml
name: contract-explosion-knockback
tags:
  - contract
  - exclusive
description: "A creeper blowing up 5 blocks off pushes the bot by (1 - d/6) away from the blast, hurts her by the vanilla rule and is removed. Contract check tests/minecraft/contract/checks/explosion-knockback.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: explosion-knockback
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - difficulty easy
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
