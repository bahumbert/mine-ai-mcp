template: ../../templates/flat-single-action.yaml
name: contract-respawn-at-set-point
tags:
  - contract
description: "A command-set personal spawn, its player-data keys, respawn offsets and an obstructed point. Contract check tests/minecraft/contract/checks/respawn-at-set-point.ts; setup from setupCommands(fixture)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: respawn-at-set-point
reset: []
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: iron_sword
        count: 1
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
