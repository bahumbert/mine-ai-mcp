template: ../../templates/flat-single-action.yaml
name: contract-state-id-agrees
tags:
  - contract
description: world.getBlockStateId and blockAt read the same state for stairs set with properties. Contract check
  tests/minecraft/contract/checks/state-id-agrees.ts, also run on the fake bot (bot-contract.test.ts); setup from
  setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
params:
  check: state-id-agrees
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock 2 -60 0 oak_stairs[facing=east,half=top]
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
