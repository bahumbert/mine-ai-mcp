template: ../../templates/flat-single-action.yaml
name: contract-attack-hurts-and-kills
tags:
  - contract
description: "A zombie with no AI and no armor dies of the 4th iron-sword hit (damage_event, health in metadata, entityDead, removal after its death animation); by hand a hit costs 1. Contract check tests/minecraft/contract/checks/attack-hurts-and-kills.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: attack-hurts-and-kills
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - difficulty easy
  - time set 18000
entities:
  - type: zombie
    pos:
      - 0.5
      - -60
      - 2.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
  - type: zombie
    pos:
      - -2.5
      - -60
      - 0.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: iron_sword
        count: 1
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
