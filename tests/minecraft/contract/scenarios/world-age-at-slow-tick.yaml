template: ../../templates/flat-single-action.yaml
name: contract-world-age-at-slow-tick
tags:
  - contract
  - exclusive
description: "The world age of a server at tick rate 8: the regular time packets and the ages they carry, counted against the ticks the server ran. Contract check
  tests/minecraft/contract/checks/world-age-at-slow-tick.ts, also run on the fake bot (bot-contract.test.ts); setup from
  setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
params:
  check: world-age-at-slow-tick
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - tick rate 8
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
