template: ../../templates/flat-single-action.yaml
name: contract-chest-open-take-close
tags:
  - contract
description: A chest opens with open_window then its items; withdraw, deposit and close are clicks the server keeps; a
  chest out of reach never opens. Contract check tests/minecraft/contract/checks/chest-open-take-close.ts, also run on
  the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: chest-open-take-close
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock 0 -60 0 chest
  - setblock 3 -60 0 chest
  - item replace block 0 -60 0 container.0 with cobblestone 64
  - item replace block 0 -60 0 container.1 with cobblestone 6
  - item replace block 0 -60 0 container.2 with torch 3
  - item replace block 3 -60 0 container.0 with dirt 5
players:
  - name: Actor
    pos:
      - -4.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: bread
        count: 4
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
