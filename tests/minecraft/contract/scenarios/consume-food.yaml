template: ../../templates/flat-single-action.yaml
name: contract-consume-food
tags:
  - contract
description: "A golden apple is eaten in ~1.6 s with its effects, bread at food 20 is refused, a released bite keeps the stack. Contract check tests/minecraft/contract/checks/consume-food.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: consume-food
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: golden_apple
        count: 2
      - item: bread
        count: 2
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
