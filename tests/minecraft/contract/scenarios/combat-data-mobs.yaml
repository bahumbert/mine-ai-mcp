template: ../../templates/flat-single-action.yaml
name: contract-combat-data-mobs
tags:
  - contract
description: "Measures every mob species the registry lists (attributes, self-explosion, ranged explosion) on the real server and equals src/world/data/combat-data/1.21.4.json. Contract check tests/minecraft/contract/checks/combat-data-mobs.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: combat-data-mobs
reset: []
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - difficulty easy
  - time set 18000
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
