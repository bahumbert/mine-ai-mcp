template: ../../templates/flat-single-action.yaml
name: contract-furnace-take-corrected
tags:
  - contract
description: Measure the server's correction of a stale furnace output prediction.
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: furnace-take-corrected
reset: []
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock 0 -60 0 furnace
  - item replace block 0 -60 0 container.0 with raw_iron 64
  - item replace block 0 -60 0 container.1 with coal 64
  - item replace block 0 -60 0 container.2 with iron_ingot 2
players:
  - name: Actor
    pos: [-2.5, -60, 0.5]
    op: true
goal:
  kind: all
  timeout: 120
  goals:
    - kind: completion
      who: Actor
