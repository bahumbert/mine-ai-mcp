template: ../../templates/flat-single-action.yaml
name: contract-attack-out-of-reach
tags:
  - contract
description: "A hit on a mob lands up to a box distance of 6 from the eye and is ignored beyond. Contract check tests/minecraft/contract/checks/attack-out-of-reach.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: attack-out-of-reach
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - difficulty easy
  - time set 18000
entities:
  - type: zombie
    pos:
      - -1.7
      - -60
      - 0.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
  - type: zombie
    pos:
      - -0.7
      - -60
      - 0.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
  - type: zombie
    pos:
      - 0.2
      - -60
      - 0.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
  - type: zombie
    pos:
      - 0.7
      - -60
      - 0.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
  - type: zombie
    pos:
      - 0.9
      - -60
      - 0.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
  - type: zombie
    pos:
      - 1.4
      - -60
      - 0.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
players:
  - name: Actor
    pos:
      - -5.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: iron_sword
        count: 1
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
