template: ../../templates/flat-single-action.yaml
name: contract-deflect-fireball
tags:
  - contract
  - exclusive
description: "A fireball flies with rare updates, is deflected along the bot's look by a hit in reach and ignored out of reach, and blows up on her. Contract check tests/minecraft/contract/checks/deflect-fireball.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: deflect-fireball
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - difficulty easy
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
