template: ../../templates/flat-single-action.yaml
name: contract-projectile-hit-bot
tags:
  - contract
  - exclusive
description: "An arrow and a small fireball shot by a mob hit the bot: spawn, damage_event naming shooter and projectile, health, push, and the fireball's fire. Contract check tests/minecraft/contract/checks/projectile-hit-bot.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: projectile-hit-bot
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - difficulty easy
  - time set 18000
entities:
  - type: skeleton
    pos:
      - 4.5
      - -60
      - 0.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
  - type: blaze
    pos:
      - -4.5
      - -60
      - 0.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
