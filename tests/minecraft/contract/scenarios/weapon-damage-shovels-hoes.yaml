template: ../../templates/flat-single-action.yaml
name: contract-weapon-damage-shovels-hoes
tags:
  - contract
description: "Each shovel and hoe the tests swing costs three unarmored zombies its vanilla damage at its vanilla swing speed. Contract check tests/minecraft/contract/checks/weapon-damage-shovels-hoes.ts (table: weapon-tools.ts), also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
