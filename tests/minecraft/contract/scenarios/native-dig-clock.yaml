template: ../../templates/flat-single-action.yaml
name: contract-native-dig-clock
tags: [contract]
description: Native hand digging waits for the server's mining ticks and authoritative air before returning.
client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/bot-contract.ts, --without-runtime]
params:
  check: native-dig-clock
reset: []
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock 1 -60 0 deepslate
players:
  - name: Actor
    pos: [0.5, -60, 0.5]
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
