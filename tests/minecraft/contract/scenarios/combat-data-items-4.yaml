template: ../../templates/flat-single-action.yaml
name: contract-combat-data-items-4
tags:
  - contract
description: "Measures the main-hand attack_damage and attack_speed of a slice of the registry's items on the real server and equals the shipped combat data. Contract check tests/minecraft/contract/checks/combat-data-items-4.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: combat-data-items-4
reset: []
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  stillTicks: 1520 # Task 8: longest passing still span 754 ticks (20 tps; 10 tps 505, base code 502); 2x rounded up to 20.
  goals:
    - kind: completion
      who: Actor
