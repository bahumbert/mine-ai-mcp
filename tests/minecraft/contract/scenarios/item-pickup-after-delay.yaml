template: ../../templates/flat-single-action.yaml
name: contract-item-pickup-after-delay
tags:
  - contract
  - exclusive
description: "The server picks an item entity up once its pickup delay is over, in reach of the bot and with room:
  collect, the slot and the removal in one tick; a pickup that fits only in part sends the slot alone and the client
  never hears the new count; a full inventory picks nothing up. Contract check
  tests/minecraft/contract/checks/item-pickup-after-delay.ts, also run on the fake bot (bot-contract.test.ts); setup
  from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: item-pickup-after-delay
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: cobblestone
        count: 59
