template: ../../templates/flat-single-action.yaml
name: contract-unequip-hand
tags:
  - contract
description: "unequip(hand) selects a free hotbar slot, or clicks the held stack into the main inventory when the hotbar is full. Contract check tests/minecraft/contract/checks/unequip-hand.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: unequip-hand
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: stone
        count: 1
      - item: dirt
        count: 1
      - item: cobblestone
        count: 1
      - item: oak_planks
        count: 1
      - item: sand
        count: 1
      - item: gravel
        count: 1
      - item: glass
        count: 1
      - item: torch
        count: 1
      - item: bricks
        count: 1
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
