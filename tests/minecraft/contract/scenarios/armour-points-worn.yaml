template: ../../templates/flat-single-action.yaml
name: contract-armour-points-worn
tags:
  - contract
description: "The armour and toughness attributes of the own body after an equip, a swap, an unequip and a death. Contract check tests/minecraft/contract/checks/armour-points-worn.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: armour-points-worn
reset: []
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: iron_chestplate
        count: 1
      - item: diamond_chestplate
        count: 1
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
