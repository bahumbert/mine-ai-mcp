template: ../../templates/flat-single-action.yaml
name: contract-bed-sleep-and-wake
tags:
  - contract
description: "A night bed in a world whose time runs: the sleep is accepted, the player is seated with her pose and sleeping position in the metadata and the bed shown occupied; wake frees her at once with the night on; a sleep left alone is ended by the server skipping the night to the dawn. Contract check tests/minecraft/contract/checks/bed-sleep-and-wake.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: bed-sleep-and-wake
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock 1 -60 0 red_bed[facing=east,occupied=false,part=foot]
  - setblock 2 -60 0 red_bed[facing=east,occupied=false,part=head]
  - gamerule doDaylightCycle true
  - time set 14000
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
