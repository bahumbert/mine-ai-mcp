template: ../../templates/flat-single-action.yaml
name: contract-items-match-slots
tags:
  - contract
description: Given stacks fill the hotbar first, split at 64; inventory.items() is the non-empty slots 9-44. Contract
  check tests/minecraft/contract/checks/items-match-slots.ts, also run on the fake bot (bot-contract.test.ts); setup
  from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
params:
  check: items-match-slots
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: cobblestone
        count: 70
      - item: oak_log
        count: 3
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
