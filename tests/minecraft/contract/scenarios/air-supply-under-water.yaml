template: ../../templates/flat-single-action.yaml
name: contract-air-supply-under-water
tags:
  - contract
description: The air_supply metadata of the bot's own entity is not sent for a full meter with the eye in air, falls a
  tick at a time with the eye under water in a 2-deep pool, and refills out of it up to the full 300. Contract check
  tests/minecraft/contract/checks/air-supply-under-water.ts, also run on the fake bot (bot-contract.test.ts); setup
  from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: air-supply-under-water
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock -1 -60 0 glass
  - setblock 1 -60 0 glass
  - setblock 0 -60 -1 glass
  - setblock 0 -60 1 glass
  - setblock -1 -59 0 glass
  - setblock 1 -59 0 glass
  - setblock 0 -59 -1 glass
  - setblock 0 -59 1 glass
  - setblock 0 -60 0 water
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
