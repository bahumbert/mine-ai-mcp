template: ../../templates/flat-single-action.yaml
name: contract-boat-mount-refused
tags:
  - contract
description: A mount the server refuses (a boat 7 blocks off, a boat with its two seats taken) is answered with nothing;
  a boat 6 blocks off and a boat with one passenger take her. Contract check
  tests/minecraft/contract/checks/boat-mount-refused.ts, also run on the fake bot (bot-contract.test.ts); setup from
  setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: boat-mount-refused
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
entities:
  - type: oak_boat
    pos:
      - 0.5
      - -60
      - -6.5
  - type: oak_boat
    pos:
      - 6.5
      - -60
      - 0.5
  - type: oak_boat
    pos:
      - 6.5
      - -60
      - 3.5
    nbt: '{Passengers:[{id:"minecraft:armor_stand"},{id:"minecraft:armor_stand"}]}'
  - type: oak_boat
    pos:
      - 6.5
      - -60
      - -2.5
    nbt: '{Passengers:[{id:"minecraft:armor_stand"}]}'
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
