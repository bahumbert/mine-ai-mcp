template: ../../templates/flat-single-action.yaml
name: contract-respawn-after-death
tags:
  - contract
description: "A player killed on a real server and respawned by Mineflayer's own request: the packets the client hears from the death until its physics ticks again. Contract check tests/minecraft/contract/checks/respawn-after-death.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: respawn-after-death
reset: []
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: iron_sword
        count: 1
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
