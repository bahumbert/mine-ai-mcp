template: ../../templates/flat-single-action.yaml
name: contract-attack-mob-knockback-decay
tags:
  - contract
description: "A mob with no AI that the bot hits by hand is pushed 0.4 away, never moves, and its velocity decays by 0.98 a tick to zero 12 s after the hit. Contract check tests/minecraft/contract/checks/attack-mob-knockback-decay.ts, also run on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts)."
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: attack-mob-knockback-decay
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - difficulty easy
  - time set 18000
entities:
  - type: zombie
    pos:
      - -1.5
      - -60
      - 0.5
    nbt: '{NoAI:1b,PersistenceRequired:1b,attributes:[{id:"minecraft:armor",base:0d}]}'
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: iron_sword
        count: 1
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
