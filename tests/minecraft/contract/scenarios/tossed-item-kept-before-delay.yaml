template: ../../templates/flat-single-action.yaml
name: contract-tossed-item-kept-before-delay
tags:
  - contract
description: A tossed stack is not picked up again before the 40 ticks of pickup delay the server gives a toss, then
  comes back in one collect. Contract check tests/minecraft/contract/checks/tossed-item-kept-before-delay.ts, also run
  on the fake bot (bot-contract.test.ts); setup from setupCommands(fixture) (setup-commands.test.ts).
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/bot-contract.ts
    - --without-runtime
params:
  check: tossed-item-kept-before-delay
setup:
  - fill -6 -61 -6 6 -61 6 stone
  - fill -6 -60 -6 6 -55 6 air
  - setblock 1 -60 0 stone
  - setblock -1 -60 0 stone
  - setblock 0 -60 1 stone
  - setblock 0 -60 -1 stone
  - setblock 1 -59 0 stone
  - setblock -1 -59 0 stone
  - setblock 0 -59 1 stone
  - setblock 0 -59 -1 stone
players:
  - name: Actor
    pos:
      - 0.5
      - -60
      - 0.5
    op: true
    inventory:
      - item: cobblestone
        count: 10
goal:
  kind: all
  timeout: 90
  goals:
    - kind: completion
      who: Actor
