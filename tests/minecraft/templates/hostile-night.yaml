# Shared setup for the hostile-night bed (spec 2026-11-06-p4-01 D6): a flat arena at midnight on normal difficulty,
# one op player (the driver sends its commands as chat), a runtime reflex that fights back on its own.
# Mob spawning is off: a scenario summons the hostile it needs, so a run never meets a mob it did not place.
# `exclusive`: a server of its own (spec D6: a death respawns the actor at the world spawn, which must not be another
# lane's cell; the day/night cycle and the difficulty are server-wide too); a scenario lists the tag itself, since
# Mine Labs replaces a whole top-level field when merging templates.
spectator:
  mods:
    - { id: blockhighlighter, path: ../../../.mine-labs/mods/blockhighlighter.jar }
  systemProperties:
    blockhighlighter.serverPortOffset: "10000"
minecraft:
  version: "1.21.4"

tags: [exclusive]

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"
  - "fill -16 -59 -16 20 -40 16 air"

setup:
  - "difficulty normal"

players:
  - name: Actor
    pos: [0.5, -60, 0.5]
    op: true

tick:
  - "gamemode spectator @a[name=!Actor,gamemode=!spectator]"

goal:
  kind: all
  timeout: 90
  goals:
    - { kind: completion, who: Actor }
