template: ../../templates/flat-single-action.yaml
name: tend-crops-plant
tags: [acceptance]
description: >-
  A player's first farm: a 5 x 5 patch of grass with one water source in its middle. tend_crops tills every soil cell
  with the carried hoe (a right-click on its top face) and plants wheat seeds on each, leaving the water as it is.
  24 cells become farmland with wheat on them; the water cell is reported, not changed.

geometry:
  - fill: { block: grass_block, from: [-4, -61, -6], to: [10, -61, 6] }
  - fill: { block: water, from: [4, -61, 0], to: [4, -61, 0] }

players:
  - name: Actor
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: wooden_hoe, count: 1 }
      - { item: wheat_seeds, count: 24 }

params:
  action: tend_crops
  input: { x1: 2, z1: -2, x2: 6, z2: 2, y: -61, plant: wheat_seeds }

goal:
  kind: all
  timeout: 180
  goals:
    - { kind: completion, who: Actor }
    - kind: blocksAt
      block: farmland
      positions: [[2, -61, -2], [2, -61, -1], [2, -61, 0], [2, -61, 1], [2, -61, 2], [3, -61, -2], [3, -61, -1], [3, -61, 0], [3, -61, 1], [3, -61, 2], [4, -61, -2], [4, -61, -1], [4, -61, 1], [4, -61, 2], [5, -61, -2], [5, -61, -1], [5, -61, 0], [5, -61, 1], [5, -61, 2], [6, -61, -2], [6, -61, -1], [6, -61, 0], [6, -61, 1], [6, -61, 2]]
    - kind: blocksAt
      block: wheat
      positions: [[2, -60, -2], [2, -60, -1], [2, -60, 0], [2, -60, 1], [2, -60, 2], [3, -60, -2], [3, -60, -1], [3, -60, 0], [3, -60, 1], [3, -60, 2], [4, -60, -2], [4, -60, -1], [4, -60, 1], [4, -60, 2], [5, -60, -2], [5, -60, -1], [5, -60, 0], [5, -60, 1], [5, -60, 2], [6, -60, -2], [6, -60, -1], [6, -60, 0], [6, -60, 1], [6, -60, 2]]
    - kind: blocksAt
      block: water
      positions: [[4, -61, 0]]
