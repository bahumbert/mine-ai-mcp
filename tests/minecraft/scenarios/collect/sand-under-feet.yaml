template: ../../templates/flat-single-action.yaml
name: sand-under-feet
tags: [regression]
description: >-
  The bot starts standing on the only sand block of the area and collects one.
  The block under the feet is a problem of stance: the bot steps off it and
  mines it from the side, instead of settling with no reachable target
  (mixed-sand, where a column stump left under the bot was the last match).

geometry:
  - fill: { block: stone, from: [-6, -60, -6], to: [8, -60, 6] }
  - setblock: { block: sand, at: [0, -59, 0] }

players:
  - name: Actor
    pos: [0.5, -58, 0.5]

params:
  action: collect_block
  input:
    block_name: sand
    count: 1
    scaffold: false

goal:
  kind: all
  timeout: 20
  goals:
    - { kind: hasItem, item: sand, count: 1 }
    - { kind: completion }
