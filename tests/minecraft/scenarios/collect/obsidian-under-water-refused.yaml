template: ../../templates/collect/single-action.yaml

name: obsidian-under-water-refused
tags: [acceptance]
description: Refuse an obsidian target with water flowing over it, even with an empty bucket
  carried (the bot never mines under water, run 10). Nothing is broken, the bucket stays empty,
  full health and no recorded death.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  gamerules: { doMobSpawning: false, naturalRegeneration: false }
reset: ["fill -6 -61 -5 10 -54 5 air"]
geometry:
  - fill: { block: stone, from: [-5, -61, -4], to: [9, -60, 4] }
  - setblock: { block: obsidian, at: [2, -60, 0] }
  # The source flows onto the obsidian's top: the target is under water.
  - setblock: { block: water, at: [3, -59, 0] }
  - setblock: { block: lava, at: [2, -60, 1] }
players:
  - name: DrainMiner
    pos: [0.5, -59, 0.5]
    inventory: [{ item: diamond_pickaxe, count: 1 }, { item: cobblestone, count: 32 }, { item: bucket, count: 1 }]
params:
  action: collect_block
  input:
    block_name: obsidian
    count: 1
    scaffold: false
  expect: { status: failed, errorContains: "never mines under water" }

goal:
  kind: all
  timeout: 90
  goals:
    - { kind: blocksAt, block: obsidian, positions: [[2, -60, 0]] }
    - { kind: hasItem, who: DrainMiner, item: bucket, count: 1 }
    # No `survive`: the refusal ends the run within a second; full health below rules out a death.
    - { kind: completion, who: DrainMiner }
    - { kind: health, who: DrainMiner, health: 20 }
