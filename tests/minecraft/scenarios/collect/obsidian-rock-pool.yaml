template: ../../templates/flat-single-action.yaml

name: obsidian-rock-pool
tags: [regression]
description: >-
  A 5x5 lava pool sealed in rock under a stone lid, no exposed face. The collect opens a pour
  cell, casts, scoops the water back and must mine three obsidian. The scoop leaves unfed
  residual flow over the formed obsidian; the drain must let that flow decay, not plug the only
  dig ray, or collection loses the target and falls into branch mining until it stalls.

# The legacy scenarios/flat/collect/obsidian-in-rock.yaml fixture in the lane frame: the
# pool is a single layer of 25 sources buried in stone. Every cast and scoop is real, the
# server confirms each scoop, and the residual flow after it is the world's own (no command
# sets a decaying flow: whether one decays is only measured in game).

reset:
  - "fill -20 -56 -20 20 -40 20 air"

geometry:
  # Solid rock from y -61 to y -57 with the pool buried inside it: stone on every side of
  # the lava and a stone lid over it. The bot walks on the lid.
  - fill: { block: stone, from: [-20, -61, -20], to: [20, -57, 20] }
  - fill: { block: lava, from: [5, -59, -2], to: [9, -59, 2] }

players:
  - name: Collector
    pos: [0, -56, 0]
    inventory:
      - { item: water_bucket, count: 1 }
      - { item: diamond_pickaxe, count: 1 }
      - { item: cobblestone, count: 32 }

params:
  action: collect_block
  input:
    block_name: obsidian
    count: 3
    scaffold: false

tick:
  - "gamemode spectator @a[name=!Collector,gamemode=!spectator]"

goal:
  kind: all
  timeout: 420
  goals:
    - kind: hasItem
      who: Collector
      item: obsidian
      count: 3
    # The bucket comes back, the only thing that makes a second cast possible, and the bot
    # ends dry rather than in the pool.
    - kind: hasItem
      who: Collector
      item: water_bucket
      count: 1
    - { kind: health, who: Collector, health: 20 }
    # Completion must not be earned by respawning with keepInventory.
    - kind: survive
      who: Collector
      seconds: 1
    - kind: completion
      who: Collector
