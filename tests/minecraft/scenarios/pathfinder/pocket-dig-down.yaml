template: ../../templates/flat-single-action.yaml

name: pocket-dig-down-with-style-override
tags: [regression]
description: >-
  Run 15, Dirk and Sana stood pinned for hours in a pocket of their own diggings: water beside the head, stone above, and
  their persona's override (navigation.dig_straight_down false) left no first move, so every navigate failed at once.
  A bot in a one-cell pocket cut into stone, walled in by stone with source water just beyond the walls and over the roof, carries that
  override; navigate to the cell below it must set the override aside for that leg and arrive in the cave cell one block lower and aside.

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "fill -8 -63 -8 8 -40 8 air"

geometry:
  - fill: { block: stone, from: [-5, -63, -5], to: [5, -50, 5] }
  # Source water two blocks east, west, north and south of the pocket, behind a wall of stone, and over the stone above it: every
  # side and upward dig opens into water, and only the dig straight down is free (the bot's override forbids it).
  - fill: { block: water, from: [-2, -57, -1], to: [-2, -56, 1] }
  - fill: { block: water, from: [2, -56, -1], to: [2, -55, 1] }
  - fill: { block: water, from: [-1, -57, -2], to: [1, -56, -2] }
  - fill: { block: water, from: [-1, -57, 2], to: [1, -56, 2] }
  - fill: { block: water, from: [-1, -54, -1], to: [1, -54, 1] }
  # The pocket itself, two cells high, and a side cell the pocket cannot reach (its head room is stone with water beyond) over a cave cell, as in Dirk's cell.
  - fill: { block: air, from: [0, -57, 0], to: [0, -56, 0] }
  - fill: { block: air, from: [1, -58, 0], to: [1, -57, 0] }

players:
  - name: Pinned
    pos: [0.5, -57, 0.5]
    inventory:
      - { item: stone_pickaxe, count: 1 }

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/styled-navigate.ts]

tick:
  - "gamemode spectator @a[name=!Pinned,gamemode=!spectator]"

params:
  noDigStraightDown: true
  target: [1, -58, 0]
  range: 0

goal:
  kind: all
  timeout: 90
  goals:
    - kind: reach
      who: Pinned
      pos: [1.5, -58, 0.5]
      radius: 1.0
    - { kind: health, who: Pinned, health: 20 }
    - { kind: completion, who: Pinned }
