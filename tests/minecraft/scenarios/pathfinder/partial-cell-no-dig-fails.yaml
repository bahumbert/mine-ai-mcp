template: ../../templates/flat-single-action.yaml

name: partial-cell-no-dig-fails
tags: [regression]
description: >-
  The partial-cell dig-out of a run that may not dig: the same pocket as partial-cell-dig-out, navigate with dig false.
  The call fails at once with "Standing inside the partial block ..." and the stalk stays standing.

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "fill -8 -60 -8 8 -55 8 air"

geometry:
  - fill: { block: bamboo, from: [0, -60, 0], to: [0, -59, 0] }
  - fill: { block: bamboo, from: [-1, -60, 0], to: [-1, -59, 0] }
  - fill: { block: bamboo, from: [0, -60, 1], to: [0, -59, 1] }
  - fill: { block: "oak_leaves[persistent=true]", from: [0, -60, -1], to: [0, -59, -1] }
  - fill: { block: "oak_leaves[persistent=true]", from: [1, -60, 0], to: [1, -59, 0] }

players:
  - name: Actor
    pos: [0.7, -60, 0.74]

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/partial-cell-dig-out.ts]

params:
  pocket: { x: 0, y: -60, z: 0 }
  target: [-6, -60, 0]
  dig: false

goal:
  kind: all
  timeout: 60
  goals:
    - kind: completion
      who: Actor
