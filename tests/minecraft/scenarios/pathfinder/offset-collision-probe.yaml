template: ../../templates/flat-single-action.yaml

name: offset-collision-probe
tags: [regression]
description: >-
  Live 2026-10-18/19, Ayla stood at 191,78,292 and the server put her back every 100 ms for 15+ minutes: vanilla moves
  every bamboo stalk sideways by an amount that depends on its x and z, Mineflayer gives one box to every position, so
  the client walked into the server's stalk. The bot walks straight at five stalks from their four sides; the server is
  the oracle. Pass = no forced move and a stop flush with the stalk as the server has it.

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "fill 185 -60 -14 197 -55 -2 air"

# Two high, three apart: no approach cell holds a stalk. The first is Ayla's cell of the live case (x 191, z 292 there); the
# arena puts it at z -8, and each lane gives every stalk its own offset, so the server is the oracle for all of them.
geometry:
  - fill: { block: bamboo, from: [191, -60, -8], to: [191, -59, -8] }
  - fill: { block: bamboo, from: [188, -60, -8], to: [188, -59, -8] }
  - fill: { block: bamboo, from: [194, -60, -8], to: [194, -59, -8] }
  - fill: { block: bamboo, from: [191, -60, -11], to: [191, -59, -11] }
  - fill: { block: bamboo, from: [191, -60, -5], to: [191, -59, -5] }

players:
  - name: Actor
    pos: [189.5, -60, -7.5]

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/offset-collision.ts]

params:
  debugExecuteJavaScript: true
  stalks:
    - { at: [191, -60, -8] }
    - { at: [188, -60, -8] }
    - { at: [194, -60, -8] }
    - { at: [191, -60, -11] }
    - { at: [191, -60, -5] }

goal:
  kind: all
  timeout: 240
  goals:
    - kind: completion
      who: Actor
