template: ../../templates/flat-single-action.yaml

name: drop-past-reach-into-flowing-water
tags: [regression]
description: >-
  Twelve blocks above two water bodies, a bot on a one-wide ledge reaches the goal by the source pool. The
  nearer body to the goal is a two-deep flowing channel (a source at its far end), the other a sealed
  two-deep source pool. A fall past the dry maximum drop is planned only into source water, so the way
  down is the pool, then a swim out and a walk to the goal. This scenario keeps the pool landing working
  beside a refused channel. It asserts the goal, not the route taken (the old code passes it too);
  drop-past-reach-flowing-water-only is the one that fails on the old code.

# P4-06b task 4 (spec D6, cause 6). The ledge runs along x at z 0, 12 blocks over the water surface. The pool
# (x 1..3) sits beside its start; the channel (x 7, z 1) beside its middle, closer to the goal at x 10, and ends
# against the ledge. Both are walled level with the water surface so the bot climbs out and steps down.

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "fill -4 -62 -8 20 -30 8 air"

geometry:
  - fill: { block: stone, from: [ -4, -62, -8 ], to: [ 20, -61, 8 ] }
  # The ledge, one block wide, standing feet at y -47. Bedrock: the bot has no tool and would dig down through stone.
  - fill: { block: bedrock, from: [ 0, -60, 0 ], to: [ 12, -48, 0 ] }
  # The sealed source pool, 3 x 3, two deep.
  - fill: { block: stone, from: [ 0, -60, 1 ], to: [ 4, -59, 4 ] }
  - fill: { block: water, from: [ 1, -60, 1 ], to: [ 3, -59, 3 ] }
  # The channel: a walled corridor at x 7, z 1..2. The source column is at z 2; the cell z 1 is flowing water
  # (level 1) two deep, set as the flow itself would leave it, so it is settled when the bot plans.
  - fill: { block: stone, from: [ 6, -60, 1 ], to: [ 8, -59, 3 ] }
  - fill: { block: "water[level=1]", from: [ 7, -60, 1 ], to: [ 7, -59, 1 ] }
  - fill: { block: water, from: [ 7, -60, 2 ], to: [ 7, -59, 2 ] }

players:
  - name: LedgeBot
    pos: [ 0.5, -47, 0.5 ]

tick:
  - "gamemode spectator @a[name=!LedgeBot,gamemode=!spectator]"

params:
  action: navigate
  input:
    x: 10
    y: -60
    z: 3
    range: 1.5

goal:
  kind: all
  timeout: 120
  goals:
    - kind: reach
      who: LedgeBot
      pos: [ 10.5, -60, 3.5 ]
      radius: 2.0
    - kind: health
      who: LedgeBot
      health: 20
    - kind: completion
      who: LedgeBot
