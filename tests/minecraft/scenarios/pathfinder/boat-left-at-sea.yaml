template: ../../templates/flat-single-action.yaml

name: boat-left-at-sea-then-navigate
tags: [regression]
description: >-
  Run 14, 12 of 20 bots froze: a ride by boat with no land within the asked distance stays at sea in its boat, and
  the next navigate to land 60 blocks on never moved (no physics tick after the mount, the body stayed owned). The
  first navigate rides out onto a 100-block sea and stays there; the second must reach the far land.

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

geometry:
  # A sea three deep and 100 long, 81 wide, from the bot's shore (x 0) to the far land (x 101).
  - fill: { block: water, from: [ 1, -63, -40 ], to: [ 100, -61, 40 ] }

players:
  - name: Rower
    pos: [ 0.5, -60, 0.5 ]
    inventory:
      - item: oak_boat
        count: 1

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/action-sequence.ts]

tick:
  - "gamemode spectator @a[name=!Rower,gamemode=!spectator]"

params:
  actions:
    # The ride ends at the target (40 blocks out, open water): it succeeds afloat in its boat (N8) and stays at sea.
    - { action: navigate, input: { x: 40, y: -61, z: 0, range: 2 } }
    - { action: navigate, input: { x: 105, y: -60, z: 0, range: 2 } }

goal:
  kind: all
  timeout: 240
  goals:
    - kind: reach
      who: Rower
      pos: [ 105.5, -60, 0.5 ]
      radius: 3.0
    - kind: health
      who: Rower
      health: 20
    - kind: completion
      who: Rower
