template: ../../templates/flat-single-action.yaml

name: perch-bridge-with-dirt
tags: [regression]
description: >-
  The control of perch-keep-items-no-bridge: the same perch and gap, the bot carries only dirt (a block of the
  survival policy's scaffold list) and navigate is given no keep_items, so it bridges the gap and arrives.

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "fill -4 -62 -8 14 -30 8 air"

geometry:
  - fill: { block: stone, from: [ -4, -62, -8 ], to: [ 14, -61, 8 ] }
  # The perch: one block wide, eight high.
  - fill: { block: stone, from: [ 0, -60, 0 ], to: [ 0, -53, 0 ] }
  # The ledge across a five-block gap (x 1..5), at the perch's height, three wide.
  - fill: { block: stone, from: [ 6, -60, -1 ], to: [ 8, -53, 1 ] }

players:
  - name: PerchBot
    pos: [ 0.5, -52, 0.5 ]
    inventory:
      - item: dirt
        count: 24

tick:
  - "gamemode spectator @a[name=!PerchBot,gamemode=!spectator]"

params:
  action: navigate
  input:
    x: 7
    y: -52
    z: 0
    range: 1.5

goal:
  kind: all
  timeout: 150
  goals:
    - kind: reach
      who: PerchBot
      pos: [ 7.5, -52, 0.5 ]
      radius: 2.0
    - kind: health
      who: PerchBot
      health: 20
    - kind: completion
      who: PerchBot
