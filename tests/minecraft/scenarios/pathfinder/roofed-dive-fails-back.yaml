template: ../../templates/flat-single-action.yaml

name: roofed-dive-fails-back-to-air
tags: [regression]
description: >-
  Run 15, Sana drowned: a navigate committed a swim segment into a roofed water tunnel, a later search failed and the
  dive was released five blocks inside, out of reach of air. Here a bot in a two-deep pool navigates through a roofed
  tunnel to its far end; once it is inside, the tunnel is sealed ahead of it (a tick command), so the
  navigate fails mid-tunnel and the bot must swim back to the pool's air, alive.

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "fill -10 -63 -10 28 -40 10 air"

geometry:
  - fill: { block: stone, from: [-7, -63, -4], to: [20, -54, 4] }
  # An open pool x -6..-1 (z -2..2), two deep, open to the sky.
  - fill: { block: air, from: [-6, -61, -2], to: [-1, -54, 2] }
  - fill: { block: water, from: [-6, -61, -2], to: [-1, -60, 2] }
  # A roofed water tunnel, two high, from the pool east to x 5, closed by stone at x 6.
  - fill: { block: water, from: [0, -61, 0], to: [5, -60, 0] }

players:
  - name: Diver
    pos: [-1.5, -61, 0.5]
    inventory:
      - { item: stone_pickaxe, count: 1 }

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/action-sequence.ts]

tick:
  # Once the bot is one block into the tunnel, seal it ahead (x 4): the planned route can no longer be walked.
  - "execute if entity @a[name=Diver,x=1,y=-62,z=-1,dx=1,dy=3,dz=2] run fill 4 -61 0 4 -60 0 stone"
  - "gamemode spectator @a[name=!Diver,gamemode=!spectator]"

params:
  actions:
    # Eight ticks on the pool floor first: the server reports the falling air, as it had for Sana. Up to the surface,
    # where the head is in air...
    - { action: navigate, waitTicks: 8, input: { x: -3, y: -60, z: 0, range: 1, dig: false, scaffold: false } }
    # ...then the route dives into the roofed tunnel toward its end and is cut off.
    - { action: navigate, input: { x: 5, y: -61, z: 0, range: 1, dig: false, scaffold: false }, expect: failed }

goal:
  kind: all
  timeout: 150
  goals:
    - kind: reach
      who: Diver
      pos: [-3.5, -59, 0.5]
      radius: 4.5
    - { kind: health, who: Diver, health: 20 }
    - { kind: completion, who: Diver }
