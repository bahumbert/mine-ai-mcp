template: ../../templates/flat-single-action.yaml
name: report-open-sky
tags: [acceptance]
description: >-
  A foreground route leaves a six-block stone tunnel. Open-sky reporting identifies the first cell beyond the
  ceiling and marks its step reached, while navigate succeeds with the feet at the target five blocks past the mouth.
setup:
  - "difficulty peaceful"
geometry:
  - fill: { block: stone, from: [-2, -61, -2], to: [14, -61, 2] }
  - fill: { block: stone, from: [0, -58, -1], to: [5, -58, 1] }
  - fill: { block: stone, from: [-1, -60, -1], to: [5, -59, -1] }
  - fill: { block: stone, from: [-1, -60, 1], to: [5, -59, 1] }
  - fill: { block: stone, from: [-1, -60, 0], to: [-1, -58, 0] }
players:
  - name: Actor
    pos: [0.5, -60, 0.5]
client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/report-open-sky.ts]
params:
  target: { x: 10, y: -60, z: 0 }
  exit: { x: 6, y: -60, z: 0 }
goal:
  kind: all
  timeout: 60
  goals:
    - { kind: completion, who: Actor }
