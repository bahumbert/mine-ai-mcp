template: ../../templates/flat-single-action.yaml
name: shelter-off-centre-stays-up
tags: [regression]
description: >-
  Cause 1 of the "no longer in my hole" failures of the r35 set (plan 2026-11-07-p4-05a-shelter T3a): the bot stands at
  x 0.85, its centre over the cell to dig (cell 0) but its box (0.3 either side) over the neighbour (cell 1), and digs
  the block under the centre. If it stays up the shelter flow has to step into the hole (a look and a short forward
  control); if it falls by itself the step-in is harmless and the fake of brain/src/shelter/dig-in.test.ts that waits for
  the control is wrong. The goal is the feet still at y -59 after the dig and 20 ticks.

reset:
  - "fill -16 -59 -16 20 -40 16 air"

geometry:
  - fill: { block: bedrock, from: [-6, -64, -6], to: [6, -64, 6] }
  - fill: { block: dirt, from: [-3, -63, -3], to: [3, -60, 3] }

players:
  - name: Actor
    pos: [0.85, -59, 0.5]
    inventory:
      - { item: dirt, count: 4 }

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/action-sequence.ts]

params:
  actions:
    - { action: raw_action, input: { operation: dig, x: 0, y: -60, z: 0 } }
    - { action: raw_action, waitTicks: 20, input: { operation: look, yaw: 0, pitch: 0 } }

goal:
  kind: all
  timeout: 60
  goals:
    - { kind: reach, who: Actor, pos: [0.85, -59, 0.5], radius: 0.3 }
    - { kind: completion, who: Actor }
