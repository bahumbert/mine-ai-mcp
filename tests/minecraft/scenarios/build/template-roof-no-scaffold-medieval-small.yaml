template: ../../templates/flat-single-action.yaml

name: template-roof-no-scaffold-medieval-small
tags: [acceptance]
description: >-
  The medieval-small template (Bruno's house: roof 5 above the door) built call by call from exactly its bill and no block
  to stand on (no dirt). Until plan 2026-11-14-house-build-fixes-2 Task 2a its roof stopped with "no scaffold block carried
  to stand on"; now the eye reaches the whole roof from the ground (the brain's count is 0, the runtime plans no stand
  column), so every call must succeed, no scaffold block is carried (so none is placed) and the whole house must stand.

# The house stands on coarse_dirt (the floor replaces its top layer), a clear ground of 33 x 33 around it.
reset:
  - "fill -16 -60 -8 16 -40 24 air"

geometry:
  - fill: { block: coarse_dirt, from: [-16, -60, -8], to: [16, -60, 24] }

players:
  - name: Actor
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: iron_shovel, count: 1 }
      - { item: spruce_stairs, count: 42 }
      - { item: oak_planks, count: 36 }
      - { item: oak_log, count: 24 }
      - { item: cobblestone, count: 16 }
      - { item: spruce_slab, count: 7 }
      - { item: glass_pane, count: 3 }
      - { item: oak_door, count: 1 }

client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/template-build.ts

params:
  template: medieval-small
  door: { x: 0, y: -59, z: 6 }
  facing: north
  scaffoldCarried: 0

goal:
  kind: all
  timeout: 900
  goals:
    - { kind: completion, who: Actor }
