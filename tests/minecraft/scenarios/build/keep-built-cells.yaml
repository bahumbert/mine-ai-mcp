template: ../../templates/flat-single-action.yaml
name: keep-built-cells
tags: [acceptance]
description: >-
  A later part of a structure must not dig what an earlier part built (live 2026-10-01: routes to a house roof dug
  out 11 cells of its walls). The actor stands in a closed room with eight-high cobblestone walls, an earlier part
  kept whole (walls and floor) with `keep`, and carries no scaffold; the cell to build lies eight blocks
  beyond the east wall. Digging through
  a wall is the only way there: without `keep` the route does it (the control run fails the wall goal); with it the
  build must give up, saying so, and every wall cell must still be cobblestone.

geometry:
  - fill: { block: stone, from: [-12, -60, -12], to: [16, -60, 12] }
  # The room: walls eight high around x -2..2, z -2..2, closed, and no scaffold carried: the only way out is through a wall.
  - fill: { block: cobblestone, from: [-2, -59, -2], to: [2, -52, 2] }
  - fill: { block: air, from: [-1, -59, -1], to: [1, -52, 1] }

players:
  - name: Actor
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: stone_pickaxe, count: 1 }
      - { item: oak_planks, count: 4 }

params:
  action: build_structure
  input:
    remove_wrong_blocks: true
    blocks:
      - { x: 10, y: -59, z: 0, block_name: oak_planks }
    keep:
