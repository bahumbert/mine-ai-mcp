template: ../../templates/flat-single-action.yaml

name: template-roof-counted-scaffold-ndebele-house
tags: [acceptance]
description: >-
  The ndebele-house template built call by call from its bill plus exactly the 1 dirt the brain's count (scaffoldNeed) asks for
  its first stage out of the eye's reach, with the calls of the stages before it sending the later stages' blocks as
  reserve_items, as the build skill does: the whole house must stand and no scaffold may be left. The driver first checks
  that 1 is the helper's count; the audits' scaffold placed per call is the measure (plan 2026-11-14-house-build-fixes-2 Task 3).

# The house stands on coarse_dirt (the floor replaces its top layer; the shovel picks up no scaffold block from it), a clear ground of 33 x 33 around it.
reset:
  - "fill -16 -60 -8 16 -40 24 air"

geometry:
  - fill: { block: coarse_dirt, from: [-16, -60, -8], to: [16, -60, 24] }

players:
  - name: Actor
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: iron_shovel, count: 1 }
      - { item: acacia_planks, count: 64 }
      - { item: acacia_planks, count: 52 }
      - { item: acacia_stairs, count: 64 }
      - { item: acacia_stairs, count: 16 }
      - { item: birch_planks, count: 42 }
      - { item: cobblestone, count: 24 }
      - { item: sandstone, count: 16 }
      - { item: glass_pane, count: 5 }
      - { item: acacia_door, count: 1 }
      - { item: acacia_slab, count: 1 }
      - { item: dirt, count: 1 }

client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/template-build.ts

params:
  template: ndebele-house
  door: { x: 0, y: -59, z: 6 }
  facing: north
  scaffoldCarried: 1

goal:
  kind: all
  timeout: 900
  goals:
    - { kind: completion, who: Actor }
