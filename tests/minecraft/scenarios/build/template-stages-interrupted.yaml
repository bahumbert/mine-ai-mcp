template: ../../templates/flat-single-action.yaml

name: template-stages-interrupted
tags: [regression]
description: >-
  The rondavel (declared stages floor, walls, roof; a round hut with stairs, slabs, fence windows and a door) cut short
  in its walls stage, as a restart of the brain cuts a build: the driver sends the floor call, starts
  the first wall call, cancels it once its first cell stands and checks it is cut midway (some cells placed, some not), then sends every call again from
  the first, as a resumed build does, and the final check. Every cell of the house and of the ring around it is read
  back, so a cell the resume left wrong or a scaffold left standing fails the run.

# The house stands on dirt (the floor replaces its top layer), a clear ground of 33 x 33 around it.
reset:
  - "fill -16 -60 -8 16 -40 24 air"

geometry:
  - fill: { block: dirt, from: [-16, -60, -8], to: [16, -60, 24] }

players:
  - name: Actor
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: iron_shovel, count: 1 }
      - { item: hay_block, count: 64 }
      - { item: packed_mud, count: 60 }
      - { item: mud_bricks, count: 16 }
      - { item: acacia_log, count: 4 }
      - { item: acacia_fence, count: 3 }
      - { item: acacia_door, count: 1 }
      - { item: dirt, count: 32 }

client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/template-build.ts

params:
  template: rondavel
  door: { x: 0, y: -59, z: 6 }
  facing: north
  interruptAfterBatch: 0
  interruptStage: walls
  cancelAfterCells: 1
  # The first placed cell stood within one world-age packet (under 20 ticks) in 6 of 6 runs at 20 and at 10 tps (2026-11-22);
  # twice the 20-tick packet resolution, rounded up to 20 (test-writing P5); the wait runs one packet past it (waitServerTicks).
  cancelWithinTicks: 40

goal:
  kind: all
  timeout: 900
  goals:
    - { kind: completion, who: Actor }
