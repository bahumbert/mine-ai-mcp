template: ../../templates/flat-single-action.yaml

name: template-roof-counted-scaffold-pagoda-house
tags: [acceptance]
description: >-
  The pagoda-house template built call by call from its bill plus exactly the 2 dirt the brain's count (scaffoldNeed) asks for
  its first stage out of the eye's reach, with the calls of the stages before it sending the later stages' blocks as
  reserve_items, as the build skill does: the whole house must stand and no scaffold may be left. The driver first checks
  that 2 is the helper's count; the audits' scaffold placed per call is the measure (plan 2026-11-14-house-build-fixes-2 Task 3).

# The house stands on coarse_dirt (the floor replaces its top layer; the shovel picks up no scaffold block from it), a clear ground of 33 x 33 around it.
reset:
  - "fill -16 -60 -8 16 -40 24 air"

geometry:
  - fill: { block: coarse_dirt, from: [-16, -60, -8], to: [16, -60, 24] }

players:
  - name: Actor
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: iron_shovel, count: 1 }
      - { item: dark_oak_stairs, count: 64 }
      - { item: dark_oak_stairs, count: 64 }
      - { item: dark_oak_stairs, count: 48 }
      - { item: dark_oak_log, count: 64 }
      - { item: dark_oak_log, count: 8 }
      - { item: stone_bricks, count: 56 }
      - { item: spruce_planks, count: 48 }
      - { item: birch_planks, count: 32 }
      - { item: dark_oak_fence, count: 16 }
      - { item: dark_oak_planks, count: 10 }
      - { item: ladder, count: 4 }
      - { item: birch_door, count: 1 }
      - { item: dark_oak_slab, count: 1 }
      - { item: dirt, count: 2 }

client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/template-build.ts

params:
  template: pagoda-house
  door: { x: 0, y: -59, z: 6 }
  facing: north
  scaffoldCarried: 2

goal:
  kind: all
  timeout: 900
  goals:
    - { kind: completion, who: Actor }
