template: ../../templates/flat-single-action.yaml

name: template-builds-hanok
tags: [acceptance]
description: >-
  The hanok template built call by call, as the build skill sends it, from exactly its bill (plus 32 dirt for the
  routes' scaffold): shows the placement rules agree with the support engine for what no game has placed yet. Every cell
  of the house and of the ring around it is read back (name, facing, half, axis), so a block that did not take, a
  ladder facing the wrong way or a scaffold left standing fails the run.

# The house stands on dirt (the floor replaces its top layer), a clear ground of 33 x 33 around it.
reset:
  - "fill -16 -60 -8 16 -40 24 air"

geometry:
  - fill: { block: dirt, from: [-16, -60, -8], to: [16, -60, 24] }

players:
  - name: Actor
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: iron_shovel, count: 1 }
      - { item: stone_brick_stairs, count: 64 }
      - { item: stone_brick_stairs, count: 36 }
      - { item: oak_log, count: 61 }
      - { item: stone_bricks, count: 53 }
      - { item: cobblestone, count: 49 }
      - { item: oak_planks, count: 39 }
      - { item: oak_fence, count: 20 }
      - { item: white_wool, count: 12 }
      - { item: stone_brick_slab, count: 3 }
      - { item: oak_door, count: 1 }
      - { item: dirt, count: 32 }

client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/template-build.ts

params:
  template: hanok
  door: { x: 0, y: -59, z: 6 }
  facing: north

goal:
  kind: all
  timeout: 900
  goals:
    - { kind: completion, who: Actor }
