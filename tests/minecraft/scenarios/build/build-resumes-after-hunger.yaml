template: ../../templates/flat-single-action.yaml

name: build-resumes-after-hunger
tags: [regression]
description: >-
  Reflex continuity (spec 2026-10-18, R2): the hunger reflex takes the body mid-build and always says resume, but
  build_structure used to end cancelled with its scaffold standing in the world. The actor builds a wall of cobblestone,
  5 wide and 6 high (the upper rows are out of reach from the ground, so the routes pillar up with the carried dirt),
  while a hunger effect empties the food bar; cooked beef is carried. The build must complete once, name [HUNGER] among
  its interruptions, and leave no scaffold block behind: the first attempt's scaffold is taken down by the last.

geometry:
  - fill: { block: stone, from: [-12, -60, -12], to: [16, -60, 12] }

players:
  - name: Actor
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: cobblestone, count: 40 }
      - { item: dirt, count: 24 }
      - { item: cooked_beef, count: 16 }

params:
  action: build_structure
  expect: { status: succeeded, interruptionContains: "[HUNGER]" }
  input:
    blocks:
      - { x: -2, y: -59, z: 6, block_name: cobblestone }
      - { x: -1, y: -59, z: 6, block_name: cobblestone }
      - { x: 0, y: -59, z: 6, block_name: cobblestone }
      - { x: 1, y: -59, z: 6, block_name: cobblestone }
      - { x: 2, y: -59, z: 6, block_name: cobblestone }
      - { x: -2, y: -58, z: 6, block_name: cobblestone }
      - { x: -1, y: -58, z: 6, block_name: cobblestone }
      - { x: 0, y: -58, z: 6, block_name: cobblestone }
      - { x: 1, y: -58, z: 6, block_name: cobblestone }
      - { x: 2, y: -58, z: 6, block_name: cobblestone }
      - { x: -2, y: -57, z: 6, block_name: cobblestone }
      - { x: -1, y: -57, z: 6, block_name: cobblestone }
      - { x: 0, y: -57, z: 6, block_name: cobblestone }
      - { x: 1, y: -57, z: 6, block_name: cobblestone }
      - { x: 2, y: -57, z: 6, block_name: cobblestone }
      - { x: -2, y: -56, z: 6, block_name: cobblestone }
      - { x: -1, y: -56, z: 6, block_name: cobblestone }
      - { x: 0, y: -56, z: 6, block_name: cobblestone }
      - { x: 1, y: -56, z: 6, block_name: cobblestone }
      - { x: 2, y: -56, z: 6, block_name: cobblestone }
      - { x: -2, y: -55, z: 6, block_name: cobblestone }
      - { x: -1, y: -55, z: 6, block_name: cobblestone }
      - { x: 0, y: -55, z: 6, block_name: cobblestone }
      - { x: 1, y: -55, z: 6, block_name: cobblestone }
      - { x: 2, y: -55, z: 6, block_name: cobblestone }
      - { x: -2, y: -54, z: 6, block_name: cobblestone }
      - { x: -1, y: -54, z: 6, block_name: cobblestone }
      - { x: 0, y: -54, z: 6, block_name: cobblestone }
      - { x: 1, y: -54, z: 6, block_name: cobblestone }
      - { x: 2, y: -54, z: 6, block_name: cobblestone }

tick:
  - "gamemode spectator @a[name=!Actor,gamemode=!spectator]"
  # The food bar empties within seconds; the reflex eats and the build goes on.
  - "effect give Actor minecraft:hunger 2 120 true"

goal:
  kind: all
  timeout: 240
  goals:
    - { kind: completion, who: Actor }
    - kind: blocksAt
      block: cobblestone
      positions: [[-2, -59, 6], [2, -59, 6], [-2, -54, 6], [0, -54, 6], [2, -54, 6], [0, -57, 6]]
    - kind: survive
      who: Actor
      seconds: 5
