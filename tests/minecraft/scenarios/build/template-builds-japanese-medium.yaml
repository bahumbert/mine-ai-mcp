template: ../../templates/flat-single-action.yaml

name: template-builds-japanese-medium
tags: [acceptance]
description: >-
  The classic japanese-medium house (live-proven) built from its template file call by call, as the build skill sends it: the
  driver and the support order of a file checked without scaffolding of its own. Every cell of the house and of the
  ring around it is read back, so a block of the wrong kind or a scaffold left standing fails the run.

# The house stands on dirt (the floor replaces its top layer), a clear ground of 33 x 33 around it.
reset:
  - "fill -16 -60 -8 16 -40 24 air"

geometry:
  - fill: { block: dirt, from: [-16, -60, -8], to: [16, -60, 24] }

players:
  - name: Actor
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: iron_shovel, count: 1 }
      - { item: dark_oak_stairs, count: 60 }
      - { item: dark_oak_planks, count: 31 }
      - { item: birch_planks, count: 24 }
      - { item: cobblestone, count: 20 }
      - { item: spruce_planks, count: 15 }
      - { item: dark_oak_log, count: 12 }
      - { item: spruce_fence, count: 6 }
      - { item: dark_oak_slab, count: 3 }
      - { item: spruce_door, count: 1 }
      - { item: dirt, count: 32 }

client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/template-build.ts

params:
  template: japanese-medium
  door: { x: 0, y: -59, z: 6 }
  facing: north

goal:
  kind: all
  timeout: 900
  goals:
    - { kind: completion, who: Actor }
