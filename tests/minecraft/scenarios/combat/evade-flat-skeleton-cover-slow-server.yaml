template: ../../templates/flat-single-action.yaml
name: evade-flat-skeleton-cover-slow-server
tags: [regression, reliability]
description: A wounded actor's first evade runs into its server-tick budget (or separates), the interrupted order then resumes and succeeds, or, after a cover separation, is refused by the cover it owes ([COVER_ROUTE_REFUSED]); the run's --tick-rate selects the server rate (default 20). The first separation is not asserted (judge chain).
world:
  type: flat
  time: midnight
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false, keepInventory: true }
client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/evade-flight.ts]
reset:
  - "kill @e[type=!minecraft:player]"
  - "fill -64 -61 -64 80 -61 64 grass_block"
  - "fill -64 -63 -64 80 -62 47 dirt"
  - "fill -64 -63 48 80 -62 64 dirt"
  - "fill -16 -60 -16 64 -50 16 air"
setup:
  - "difficulty normal"
  - "fill 10 -60 3 10 -58 9 stone"
players:
  - { name: Actor, pos: [0.5, -60, 0.5], health: 7, op: true, inventory: [] }
params:
  mob: skeleton
  target: [55, -60, 0]
  spawn: [-6, -60, 0]
  judge: chain
  bases: [cover, range, disengaged]
goal:
  kind: all
  timeout: 180
  goals:
    - { kind: completion, who: Actor }
