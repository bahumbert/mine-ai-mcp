template: ../../templates/flat-single-action.yaml
name: evade-flat-skeleton-held-cover
tags: [regression, reliability]
description: A held skeleton lets the evade physically prove cover behind a wall.
world:
  type: flat
  time: midnight
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false, keepInventory: true }
client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/evade-flight.ts]
reset:
  - "kill @e[type=!minecraft:player]"
  - "fill -64 -61 -64 80 -61 64 grass_block"
  - "fill -64 -63 -64 80 -62 47 dirt"
  - "fill -64 -63 48 80 -62 64 dirt"
  - "fill -16 -60 -16 64 -50 16 air"
setup:
  - "difficulty normal"
  # The lee is 11-14 blocks from the shooter, inside the 16-block disengage line (a4 T5).
  - "fill 4 -60 3 4 -58 9 stone"
players:
  - { name: Actor, pos: [0.5, -60, 0.5], health: 7, op: true, inventory: [] }
params:
  mob: skeleton
  target: [55, -60, 0]
  spawn: [-6, -60, 0]
  # Cover is physically proved with a shooter that cannot walk at the bot.
  holdShooter: true
  judge: evade
  bases: [cover]
  maxDistance: 36
goal:
  kind: all
  timeout: 180
  goals:
    - { kind: completion, who: Actor }
