template: ../../templates/flat-single-action.yaml
name: evade-stationary-shooter-no-cover
tags: [regression, reliability]
description: A stationary shooter makes an exposed resumed destination refuse its route.
world:
  type: flat
  time: midnight
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false, keepInventory: true }
client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/evade-flight.ts]
reset:
  - "kill @e[type=!minecraft:player]"
  - "fill -64 -61 -64 80 -61 64 grass_block"
  - "fill -16 -60 -16 64 -50 16 air"
setup:
  - "difficulty normal"
  - "fill 3 -60 -2 3 -58 2 bedrock"
players:
  - { name: Actor, pos: [0.5, -60, 0.5], health: 7, op: true, inventory: [] }
tick:
  - "gamemode spectator @a[name=!Actor,gamemode=!spectator]"
params:
  mob: skeleton
  target: [4, -60, 12]
  spawn: [-6, -60, 0]
  wall: [3, -60, 0]
  nextTarget: [5, -60, 0]
  alternateNextTarget: [8, -60, 0]
  holdShooter: true
  judge: resume
  mode: no-cover
  bases: [cover]
goal:
  kind: all
  timeout: 180
  goals:
    - { kind: completion, who: Actor }
