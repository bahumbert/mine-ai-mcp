template: ../../templates/toss-rest-distance.yaml

name: barter-toss-rest-water
tags: [reliability]
description: >-
  Measurement for the brain's pick-back radius (PICK_BACK_RADIUS, relations/handoff.ts): the giver tosses one oak log
  to a receiver standing in a still, enclosed water pool 2 blocks from the giver, whose inventory is full (the giver wades in to within reach before it tosses). The log rests where it rests; the result line
  TOSS_REST gives its 3-D distance from the toss spot, the metric pick_up_items filters by.
geometry:
  - { fill: { block: water, from: [1, -61, -3], to: [4, -61, 3] } }
players:
  - name: Giver
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: oak_log, count: 1 }
  - name: Receiver
    pos: [2.5, -60, 0.5]
    inventory:
      # 35 full stacks of stone and a full stack of logs fill all 36 slots: nothing is ever taken.
      - { item: stone, count: 2240 }
      - { item: oak_log, count: 64 }
params: { giver: 0, receiver: 1, item_name: oak_log, count: 1, surface: water, mode: measure }
