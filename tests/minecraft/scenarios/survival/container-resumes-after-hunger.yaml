template: ../../templates/flat-single-action.yaml

name: container-resumes-after-hunger
tags: [regression]
description: >-
  Run 15 (2026-10-18): every body action but eleven ended when a reflex took the body, whatever the reflex said, so the
  model had to ask again. A chest 64 blocks away holds three stacks of cobblestone; the bot withdraws all three while
  the hunger effect makes the hunger reflex claim the body on the way (it eats the cooked beef it carries and says
  resume). The withdrawal must resume and finish once: 192 cobblestone carried, the result naming [HUNGER] among its
  interruptions. On the code before the change use_container ended cancelled at the first claim.

reset:
  - "fill -4 -59 -6 70 -40 6 air"

geometry:
  - fill: { block: stone, from: [-4, -61, -6], to: [70, -60, 6] }
  - setblock:
      block: 'chest{Items:[{Slot:0b,id:"minecraft:cobblestone",count:64},{Slot:1b,id:"minecraft:cobblestone",count:64},{Slot:2b,id:"minecraft:cobblestone",count:64}]}'
      at: [64, -59, 0]

players:
  - name: Actor
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: cooked_beef, count: 16 }

tick:
  - "gamemode spectator @a[name=!Actor,gamemode=!spectator]"
  # Hunger from the moment the action walks off: the bot stands still until the request starts, and the effect is
  # renewed every tick while it is away from where it started, so food falls below the reflex's threshold in seconds.
  - "execute as Actor unless entity @s[x=0,y=-59,z=0,distance=..3] run effect give @s minecraft:hunger 2 255 true"

params:
  action: use_container
  input:
    operation: withdraw
    x: 64
    y: -59
    z: 0
    items: [{ item_name: cobblestone, count: 192 }]
  expect: { status: succeeded, interruptionContains: "[HUNGER]" }

goal:
  kind: all
  timeout: 120
  goals:
    - { kind: hasItem, who: Actor, item: cobblestone, count: 192 }
    - { kind: completion, who: Actor }
