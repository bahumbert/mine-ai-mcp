template: ../../templates/flat-single-action.yaml
name: cancel-after-fill-click
tags: [regression]
description: Cancel filling a blank sign and navigate after resolving the cell.
setup: ["setblock 1 -60 1 oak_sign"]
players: [{ name: Actor, pos: [0.5, -60, -1.5] }]
client: { command: bun, cwd: ../.., args: [client-host.ts, drivers/signs.ts] }
params:
  steps:
    - { cancel: place_sign, input: &sign { x: 1, y: -60, z: 1, facing: north, lines: [Actor, hello], fill_blank: true } }
    - { waitServerTicks: 40 }
    - { call: read_signs, input: { x: 1, y: -60, z: 1 } }
    - { check: signState, frontAny: [["", "", "", ""], [Actor, hello, "", ""]] }
    - call: place_sign
      input: *sign
      expect: { anyOf: [{ status: succeeded }, { status: failed, errorContains: NO_EDITOR }, { status: failed, errorContains: CELL_TAKEN }] }
    - { call: read_signs, input: { x: 1, y: -60, z: 1 } }
    - { check: signState, frontAny: [["", "", "", ""], [Actor, hello, "", ""]] }
    - { call: navigate, input: { x: 5, y: -60, z: -1, range: 1, scaffold: false } }
goal: { kind: all, timeout: 120, goals: [{ kind: completion }] }
