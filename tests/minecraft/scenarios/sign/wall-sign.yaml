template: ../../templates/flat-single-action.yaml
name: wall-sign
tags: [acceptance]
description: Place and read a sign attached to a wall.
setup: ["setblock 1 -60 2 stone"]
players:
  - name: Actor
    pos: [0.5, -60, -1.5]
    inventory: [{ item: oak_sign, count: 1 }]
client: { command: bun, cwd: ../.., args: [client-host.ts, drivers/signs.ts] }
params:
  steps:
    - { call: place_sign, input: { x: 1, y: -60, z: 1, facing: north, attach: wall, lines: [Actor, hello] } }
    - { check: confirmed }
    - { check: signLines, at: { x: 1, y: -60, z: 1 }, front: [Actor, hello, "", ""] }
goal: { kind: all, timeout: 120, goals: [{ kind: completion }] }
