template: ../../templates/flat-single-action.yaml
name: house-no-keep-control
tags: [acceptance]
description: Compare explicit air targets with and without keep on a sign cell.
setup:
  - "setblock 1 -60 1 oak_sign"
  - "setblock 2 -60 1 oak_sign"
players:
  - name: Actor
    pos: [0.5, -60, -1.5]
    inventory: [{ item: stone_axe, count: 1 }]
client: { command: bun, cwd: ../.., args: [client-host.ts, drivers/signs.ts] }
params:
  steps:
    - call: build_structure
      input: { blocks: [{ x: 1, y: -60, z: 1, block_name: air }], remove_wrong_blocks: true, keep: [{ x: 1, y: -60, z: 1 }, { x: 1, y: -61, z: 1 }] }
      expect: { status: failed, errorContains: BUILD_INCOMPLETE }
    - { call: read_signs, input: { x: 1, y: -60, z: 1 } }
    - { check: signPresent }
    - call: build_structure
      input: { blocks: [{ x: 2, y: -60, z: 1, block_name: air }], remove_wrong_blocks: true }
    - { call: read_signs, input: { x: 2, y: -60, z: 1 } }
    - { check: signAbsent }
goal:
  kind: all
  timeout: 120
  goals:
    - { kind: completion }
    - { kind: blockAt, block: air, pos: [2, -60, 1] }
