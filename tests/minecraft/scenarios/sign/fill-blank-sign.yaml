template: ../../templates/flat-single-action.yaml
name: fill-blank-sign
tags: [acceptance]
description: Fill a blank sign and preserve signs with front or back text.
setup:
  - 'setblock 1 -60 1 oak_sign'
  - 'setblock 2 -60 1 oak_sign{front_text:{messages:["\"other\"","\"\"","\"\"","\"\""]}}'
  - 'setblock 3 -60 1 oak_sign{back_text:{messages:["\"back\"","\"\"","\"\"","\"\""]}}'
players: [{ name: Actor, pos: [0.5, -60, -1.5], inventory: [{ item: oak_sign, count: 1 }] }]
client: { command: bun, cwd: ../.., args: [client-host.ts, drivers/signs.ts] }
params:
  steps:
    - { call: place_sign, input: { x: 1, y: -60, z: 1, facing: north, lines: [Actor, hello] }, expect: { status: failed, errorContains: CELL_TAKEN } }
    - { call: place_sign, input: { x: 1, y: -60, z: 1, facing: north, lines: [Actor, hello], fill_blank: true } }
    - { check: confirmed }
    - { check: signLines, at: { x: 1, y: -60, z: 1 }, front: [Actor, hello, "", ""] }
    - { call: place_sign, input: { x: 2, y: -60, z: 1, facing: north, lines: [Actor], fill_blank: true }, expect: { status: failed, errorContains: CELL_TAKEN } }
    - { check: signLines, at: { x: 2, y: -60, z: 1 }, front: [other, "", "", ""], back: ["", "", "", ""] }
    - { call: place_sign, input: { x: 3, y: -60, z: 1, facing: north, lines: [Actor], fill_blank: true }, expect: { status: failed, errorContains: CELL_TAKEN } }
    - { check: signLines, at: { x: 3, y: -60, z: 1 }, front: ["", "", "", ""], back: [back, "", "", ""] }
goal: { kind: all, timeout: 120, goals: [{ kind: completion }] }
