template: ../../templates/flat-single-action.yaml
name: claim-sign-at-door
tags: [acceptance]
description: Place and read a claim sign beside a stone doorway.
geometry:
  - fill: { block: stone, from: [-2, -60, 2], to: [2, -58, 2] }
  - fill: { block: air, from: [0, -60, 2], to: [0, -59, 2] }
players:
  - name: Actor
    pos: [0.5, -60, -1.5]
    inventory: [{ item: oak_sign, count: 1 }]
client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/signs.ts]
params:
  steps:
    - call: place_sign
      input: { x: 1, y: -60, z: 1, facing: north, attach: ground, lines: [Actor, hello] }
    - { check: confirmed }
    - { check: signLines, at: { x: 1, y: -60, z: 1 }, front: [Actor, hello, "", ""] }
goal:
  kind: all
  timeout: 120
  goals: [{ kind: completion }]
