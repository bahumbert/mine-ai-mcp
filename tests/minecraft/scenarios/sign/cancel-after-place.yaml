template: ../../templates/flat-single-action.yaml
name: cancel-after-place
tags: [regression]
description: Cancel a sign placement and navigate after resolving the cell.
players:
  - name: Actor
    pos: [0.5, -60, -1.5]
    inventory: [{ item: oak_sign, count: 2 }]
client: { command: bun, cwd: ../.., args: [client-host.ts, drivers/signs.ts] }
params:
  steps:
    - { cancel: place_sign, input: &sign { x: 1, y: -60, z: 1, facing: north, lines: [Actor, hello] } }
    - { waitServerTicks: 40 }
    - { call: read_signs, input: { x: 1, y: -60, z: 1 } }
    - { check: signState, frontAny: [["", "", "", ""], [Actor, hello, "", ""]] }
    - call: place_sign
      input: *sign
      expect: { anyOf: [{ status: succeeded }, { status: failed, errorContains: CELL_TAKEN }] }
    - { call: navigate, input: { x: 5, y: -60, z: -1, range: 1, scaffold: false } }
goal: { kind: all, timeout: 120, goals: [{ kind: completion }] }
