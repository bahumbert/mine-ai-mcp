template: ../../templates/spectator.yaml

name: hand-over-pillar-stair
tags: [reliability]
description: >-
  Measurement, not a test (plan 2026-11-08-trading-p2-fixes Task 3.1, spec D5): the live s3r spot. The receiver stands still on the top of a
  3x3 stone pillar one block high with a stair against its east side, the giver on the floor right beside the stair (three blocks east of the receiver) with one
  bread to hand over. s3r (2026-11-08): the giver climbed by the stair and tossed from the stair and the pillar top, 0.5-1.8 blocks from the
  receiver, and both tosses were not collected. The driver traces the toss (trace) and both roles end succeeded whatever happens
  (measure), the receiver's line saying TOSS_RESULT taken=yes or taken=no with where the item rests. Geometry is s3r's moved by
  x/z -16, y -130 onto the flat template.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  difficulty: peaceful
  gamerules: { doDaylightCycle: false, doMobSpawning: false, keepInventory: true, randomTickSpeed: 0 }
reset:
  - "fill -16 -61 -16 20 -61 16 grass_block"
  - "fill -16 -60 -16 20 -40 16 air"
  - "kill @e[type=item]"
geometry:
  - { fill: { block: stone, from: [-1, -60, -1], to: [1, -60, 1] } }
  - { setblock: { block: "oak_stairs[facing=west]", at: [2, -60, 0] } }
players:
  - name: Giver
    pos: [3.5, -60, 0.5]
    inventory:
      - { item: bread, count: 3 }
  - name: Receiver
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: bread, count: 1 }
client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/hand-over.ts]
params: { giver: 0, receiver: 1, item_name: bread, count: 1, receiver_holds: 2, receiver_wait_ticks: 400, trace: true, measure: true }

goal:
  kind: all
  timeout: 60
  goals:
    - { kind: completion, who: Giver }
    - { kind: completion, who: Receiver }
