template: ../../templates/spectator.yaml

name: disposal-hole-bedrock
tags: [acceptance]
description: Refuse disposal on unbreakable ground without tossing any of the requested items.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  gamerules: { doDaylightCycle: false, doMobSpawning: false, randomTickSpeed: 0 }
reset:
  - "fill -10 -63 -10 10 -54 10 air"
geometry:
  # drop_item looks for a stance up to HOLE_SEARCH_RADIUS (8) blocks off and digs the pit beside it, so a pit can be
  # 9 blocks out: the pad reaches 10 so no dirt is in reach.
  - fill: { block: bedrock, from: [-10, -63, -10], to: [10, -61, 10] }
players:
  - name: Disposer
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: iron_shovel, count: 1 }
      - { item: rotten_flesh, count: 16 }
      - { item: cobblestone, count: 70 }
client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/single-action.ts]
params:
  action: drop_item
  input:
    items: [{ item_name: rotten_flesh, count: 12 }, { item_name: cobblestone }]
    in_a_hole: true
  expect: { status: failed, errorContains: "[DROP_HOLE_UNAVAILABLE]" }

goal:
  kind: all
  timeout: 30
  goals:
    - { kind: hasItem, who: Disposer, item: rotten_flesh, count: 16 }
    - { kind: hasItem, who: Disposer, item: cobblestone, count: 70 }
    - { kind: completion, who: Disposer }
