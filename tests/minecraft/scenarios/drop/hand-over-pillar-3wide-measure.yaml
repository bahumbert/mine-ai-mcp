template: ../../templates/spectator.yaml

name: hand-over-pillar-3wide-measure
tags: [reliability]
description: >-
  Measurement, kept for later diagnosis (plan 2026-11-08-trading-p2-fixes Task 3.3; the test is hand-over-pillar-3wide): the live s3r
  spot. The receiver stands still on the top of a 3x3 stone pillar one block high, the giver on the floor with one bread to hand over;
  the giver has to climb the pillar's side by the one-block step and toss from its top. The driver traces the toss (trace) and both
  roles end succeeded (measure), the receiver's line saying TOSS_RESULT taken=yes or taken=no with where the item rests. Before the
  fix (the toss looked without force) 11 of 12 runs missed and the item spawned with the velocity of the old pitch (horizontal
  0.28 against the aimed 0.10); with it the spawn velocity is the aimed pitch's.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  difficulty: peaceful
  gamerules: { doDaylightCycle: false, doMobSpawning: false, keepInventory: true, randomTickSpeed: 0 }
reset:
  - "fill -16 -61 -16 20 -61 16 grass_block"
  - "fill -16 -60 -16 20 -40 16 air"
  - "kill @e[type=item]"
geometry:
  - { fill: { block: stone, from: [-1, -60, -1], to: [1, -60, 1] } }
players:
  - name: Giver
    pos: [3.5, -60, 0.5]
    inventory:
      - { item: bread, count: 3 }
  - name: Receiver
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: bread, count: 1 }
client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/hand-over.ts]
params: { giver: 0, receiver: 1, item_name: bread, count: 1, receiver_holds: 2, receiver_wait_ticks: 400, trace: true, measure: true }

goal:
  kind: all
  timeout: 60
  goals:
    - { kind: completion, who: Giver }
    - { kind: completion, who: Receiver }
