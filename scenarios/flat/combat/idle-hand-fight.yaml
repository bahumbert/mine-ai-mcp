name: idle-hand-fight
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

entities:
  - type: zombie
    pos: [24.5, -60, 0.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: HandBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: shield, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  wearArmor: true
  waitTicks: 1800
  expectEvade: true
  noContact: true

tick:
  - "gamemode spectator @a[name=!HandBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 120
  stillTicks: 2860 # P4-29 a11 T8: longest passing still span 1425 ticks (20 tps 1425, 10 tps 875; n 3 and 3); 2x rounded up to 20; the timeout governs (120 s = 2400 ticks).
  goals:
    # a11 T5 (open choice 1 (b)): bare hands vs zombie, margin 1.32 < fight_margin 1.5, so the bot evades; the zombie lives, the bot is unhurt.
    - kind: entityCount
      entity: zombie
      min: 1
      max: 1
    - kind: health
      who: HandBot
      health: 20
    - kind: survive
      who: HandBot
      seconds: 1
    - kind: completion
      who: HandBot
