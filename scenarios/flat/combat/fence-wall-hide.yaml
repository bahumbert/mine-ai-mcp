name: fence-wall-hide
tags: [regression]
description: >-
  A hurt bot closes a shelter on an undiggable pad by breaking the fence
  in its head-height wall before replacing it with a full block.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: true
    randomTickSpeed: 0
reset:
  - "kill @e[type=!minecraft:player]"
  - "fill -2 -61 -2 2 -61 2 bedrock"
  - "fill -2 -60 -2 2 -57 2 air"
  - "setblock 1 -59 0 nether_brick_fence"
setup:
  - "difficulty normal"
entities:
  - type: skeleton
    pos: [13.5, -60, 0.5]
    nbt: '{PersistenceRequired:1b,HandItems:[{id:"minecraft:bow",count:1},{}]}'
  - type: zombie
    pos: [12.5, -60, -2.5]
    nbt: "{PersistenceRequired:1b}"
  - type: zombie
    pos: [12.5, -60, 3.5]
    nbt: "{PersistenceRequired:1b}"
players:
  - name: HidingBot
    pos: [0.5, -60, 0.5]
    op: true
    inventory:
      - { item: iron_pickaxe, count: 1 }
      - { item: iron_sword, count: 1 }
      - { item: cobblestone, count: 16 }
      - { item: bread, count: 4 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]
params:
  hurtTo: 7
  waitTicks: 1500
  requiredWallCells: [[1, -59, 0]]
tick:
  - "gamemode spectator @a[name=!HidingBot,gamemode=!spectator]"
goal:
  kind: all
  timeout: 120
  goals:
    - { kind: health, who: HidingBot, health: 12 }
    - { kind: survive, who: HidingBot, seconds: 1 }
    - { kind: completion, who: HidingBot }
