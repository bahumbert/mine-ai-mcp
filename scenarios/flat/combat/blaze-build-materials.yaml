name: blaze-build-materials
description: Defeat a native blaze and survive the declared terrain and supply
  constraints. This finite-mob test does not qualify blaze_rod acquisition or
  prescribe a tactic.
minecraft:
  version: 1.21.4
world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: true
players:
  - name: BlazeMaterials
    op: true
    pos:
      - 0.5
      - -60
      - 0.5
    inventory:
      - item: diamond_sword
        count: 1
      - item: shield
        count: 1
      # The hunt's recovery hold can end only by healing: regeneration is on and food is carried (the hold has no other exit before its 90 s clock).
      - item: cooked_beef
        count: 16
      # The two opposing blazes are crossfire one shield cannot answer: the hunt's admission asks for cover blocks (preparation.ts).
      - item: cobblestone
        count: 64
entities:
  - type: blaze
    pos:
      - 20.5
      - -60
      - 0.5
    nbt: "{PersistenceRequired:1b}"
  - type: blaze
    pos:
      - -20.5
      - -60
      - 0.5
    nbt: "{PersistenceRequired:1b}"
client:
  command: bun
  args:
    - ../../src/client-host.ts
    - ../../src/hunter.ts
goal:
  kind: all
  timeout: 90
  # T13ab (plan 2026-11-18-scenario-reds-part2-a10): longest passing still span 404 ticks (20 tps, n 32), 383 (10 tps, n 32); 2x rounded up to 20.
  # Runs: $RUN_DATA_DIR/run-data-p2a10-t13ab/gate-20tps, measure-20tps, gate-10tps, measure-10tps.
  stillTicks: 820
  goals:
    - kind: kill
      who: BlazeMaterials
      target: blaze
    - kind: survive
      who: BlazeMaterials
      seconds: 1
    - kind: completion
      who: BlazeMaterials
params:
  mob_name: blaze
  drop_name: blaze_rod
  count: 2
  defeat_count: 2
