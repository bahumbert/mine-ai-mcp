name: parkour-invalidation
tags: [regression]
description: A server-observed airborne parkour changes a later air dependency; the committed hop must land before replanning instead of releasing its controls over the gap.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  difficulty: peaceful
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    randomTickSpeed: 0
reset:
  - "fill -9 -64 -6 15 -45 6 air"
geometry:
  - fill: { block: stone, from: [-5, -61, -1], to: [0, -61, 1] }
  - fill: { block: stone, from: [4, -61, -1], to: [12, -61, 1] }
players:
  - name: Walker
    pos: [-2.5, -60, 0.5]
client:
  command: bun
  args: ["../../src/client-host.ts", "./parkour-invalidation.ts"]
tick:
  - "gamemode spectator @a[name=!Walker,gamemode=!spectator]"
  - "execute as @a[name=Walker,nbt={OnGround:0b},x=0,y=-60,z=-1,dx=3,dy=3,dz=2] unless block 6 -59 0 stone run setblock 6 -59 0 stone"
goal:
  kind: all
  timeout: 60
  goals:
    - { kind: completion, who: Walker }
    - { kind: reach, who: Walker, pos: [10.5, -60, 0.5], radius: 1 }
    - { kind: blocksAt, block: stone, positions: [[6, -59, 0]] }
