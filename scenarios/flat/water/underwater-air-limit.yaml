name: underwater-air-limit
description: underwater-air-limit through production navigation and survival.
minecraft: { version: "1.21.4" }
world:
  type: flat
  gamerules: { doMobSpawning: false, naturalRegeneration: false, doDaylightCycle: false }
geometry:
  - fill: { block: stone, from: [-5, -61, -5], to: [9, -49, 5] }
  - fill: { block: water, from: [-4, -60, -4], to: [8, -49, 3] }
players:
  - name: Diver
    op: true
    pos: [0.5, -49, 0.5]
    inventory:
      - { item: iron_pickaxe, count: 1 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./underwater.ts"]
goal:
  kind: all
  timeout: 120
  goals:
    - { kind: completion, who: Diver }
    - { kind: health, who: Diver, health: 20 }
params:
  reject: true
  # The seabed is beyond one breath from the surface: the search stops where the air allows, before any deep dive.
  refusal: ["[NAVIGATION_STOPPED]"]
  minYAbove: -55
  legs: [[0, -60, 0]]
