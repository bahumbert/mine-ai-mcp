name: fire-hop-airborne
tags: [regression]
description: A fire escape hopping onto a dry step waits for landing before judging its empty airborne route.
minecraft: { version: "1.21.4" }
world:
  type: flat
  difficulty: peaceful
  time: noon
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false, keepInventory: true, doFireTick: false }
reset: ["fill -3 -59 -4 14 -49 4 air"]
geometry:
  - fill: { block: lava, from: [-3, -60, -4], to: [14, -60, 4] }
  - fill: { block: nether_bricks, from: [0, -59, 0], to: [12, -55, 0] }
  - fill: { block: nether_bricks, from: [0, -59, 1], to: [12, -54, 1] }
  - fill: { block: nether_bricks, from: [-1, -54, -1], to: [-1, -51, 1] }
  - fill: { block: nether_bricks, from: [0, -54, -1], to: [3, -51, -1] }
players:
  - name: FireHop
    op: true
    effects: [{ effect: fire_resistance, seconds: 120, amplifier: 0 }]
    pos: [0.5, -54, 0.5]
client:
  command: bun
  args: ["../../src/client-host.ts", "./fire-hop-airborne.ts"]
params: { mode: hop }
goal: { kind: completion, who: FireHop, timeout: 40 }
